name: Lectura y correo

# Cada hora llama a la web publicada: lee las fuentes si los datos tienen más de 10 minutos
# y prepara el correo si es la hora de envío (9, 14 o 20 h en Madrid). No necesita secretos.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RADAR_URL: ${{ vars.RADAR_URL || 'https://radar-viral-omega.vercel.app' }}
    steps:
      - name: Lectura y correo
        run: curl -fsS --max-time 120 "$RADAR_URL/api/cron"
